name: Validar documentação

on:
  push:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tools/**'
      - '.github/workflows/validar-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tools/**'
  workflow_dispatch:

jobs:
  validar:
    name: Links e âncoras internas
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar a base de conhecimento
        run: python tools/validar_documentacao.py --caminho .
